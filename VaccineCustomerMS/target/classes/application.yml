server:
  port: 7575

spring:
  application:
    name: VaccineCustomerMS
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        service-name: VaccineCustomerMS
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${random.value}
  datasource:
    url: jdbc:h2:mem:vaccine_customer_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
