server:
  port: 8100

spring:
  application:
    name: VaccineGatewayMS
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        service-name: VaccineGatewayMS
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${random.value}
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: VaccineCustomerMS
          uri: lb://VaccineCustomerMS
          predicates:
            - Path=/vaccine/**
        - id: VaccineAppointmentMS
          uri: lb://VaccineAppointmentMS
          predicates:
            - Path=/appointment/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
