server:
  port: 6565

spring:
  application:
    name: VaccineAppointmentMS
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        service-name: VaccineAppointmentMS
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${random.value}
  datasource:
    url: jdbc:h2:mem:vaccine_appointment_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      vaccineAppointmentService:
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - jakarta.validation.ConstraintViolationException
          - com.infy.exception.InfyVaccineSchedulerException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
